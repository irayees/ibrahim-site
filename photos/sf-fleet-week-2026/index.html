<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Fleet Week 2026 | Ibrahim Rayees</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #fafafa;
            color: #111827;
        }
        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem 1.5rem;
        }
        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .back-link:hover { color: #111827; }
        h1 { margin: 0.5rem 0 0.2rem 0; font-size: 2rem; }
        .date { color: #6b7280; margin: 0; font-size: 0.95rem; }

        /* Photo Grid */
        #gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem 4rem;
        }
        @media (max-width: 900px) { #gallery-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 580px) { #gallery-grid { grid-template-columns: 1fr; } }

        .photo-item {
            border-radius: 8px;
            overflow: hidden;
            background: #e5e7eb;
            aspect-ratio: 4 / 3;
            cursor: pointer;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }
        .photo-item:hover img {
            transform: scale(1.03);
        }

        /* Lightbox Overlay */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        #lightbox.active {
            display: flex;
        }
        #lightbox-img {
            max-width: 85vw;
            max-height: 85vh;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }
        .lb-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .lb-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.06);
        }
        #lb-close {
            top: 24px;
            right: 24px;
        }
        #lb-prev {
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
        }
        #lb-prev:hover { transform: translateY(-50%) scale(1.06); }
        #lb-next {
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
        }
        #lb-next:hover { transform: translateY(-50%) scale(1.06); }

        @media (max-width: 600px) {
            #lightbox-img { max-width: 94vw; max-height: 80vh; }
            .lb-btn { width: 40px; height: 40px; font-size: 1.1rem; }
            #lb-prev { left: 10px; }
            #lb-next { right: 10px; }
            #lb-close { top: 16px; right: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/photos/" class="back-link">← Back to All Albums</a>
        <!-- CHANGE EVENT TITLE & DATE FOR WINGS OVER SOLANO -->
        <h1>SF Fleet Week 2026</h1>
        <p class="date">October 2026</p>
    </header>

    <!-- Gallery container -->
    <main id="gallery-grid"></main>

    <!-- Lightbox Modal -->
    <div id="lightbox" onclick="handleBackdropClick(event)">
        <button id="lb-close" class="lb-btn" onclick="closeLightbox()" aria-label="Close">✕</button>
        <button id="lb-prev" class="lb-btn" onclick="changePhoto(-1)" aria-label="Previous photo">❮</button>
        <img id="lightbox-img" src="" alt="Enlarged event photo">
        <button id="lb-next" class="lb-btn" onclick="changePhoto(1)" aria-label="Next photo">❯</button>
    </div>

    <script>
        // ==========================================
        // LIST YOUR UPLOADED PHOTOS HERE:
        // ==========================================
        const PHOTOS = [
            "images/photo1.jpg",
            "images/photo2.jpg",
            "images/photo3.jpg"
        ];
        // ==========================================

        let currentIndex = 0;
        const grid = document.getElementById("gallery-grid");

        // Render thumbnails on page load
        PHOTOS.forEach((src, index) => {
            const div = document.createElement("div");
            div.className = "photo-item";
            div.onclick = () => openLightbox(index);
            div.innerHTML = `<img src="${src}" loading="lazy" alt="Photo ${index + 1}">`;
            grid.appendChild(div);
        });

        // Lightbox Controls
        function openLightbox(index) {
            currentIndex = index;
            document.getElementById("lightbox-img").src = PHOTOS[currentIndex];
            document.getElementById("lightbox").classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
            document.getElementById("lightbox-img").src = "";
            document.body.style.overflow = "";
        }

        function changePhoto(direction) {
            currentIndex = (currentIndex + direction + PHOTOS.length) % PHOTOS.length;
            document.getElementById("lightbox-img").src = PHOTOS[currentIndex];
        }

        function handleBackdropClick(e) {
            if (e.target.id === "lightbox") {
                closeLightbox();
            }
        }

        // Keyboard Arrow & Escape Navigation
        document.addEventListener("keydown", (e) => {
            const lb = document.getElementById("lightbox");
            if (!lb.classList.contains("active")) return;

            if (e.key === "ArrowRight") changePhoto(1);
            if (e.key === "ArrowLeft") changePhoto(-1);
            if (e.key === "Escape") closeLightbox();
        });
    </script>

</body>
</html>
