<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Fleet Week 2026 | Ibrahim Rayees</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #fafafa;
            color: #111827;
        }
        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem 1.5rem;
        }
        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .back-link:hover { color: #111827; }
        h1 { margin: 0.5rem 0 0.2rem 0; font-size: 2rem; }
        .date { color: #6b7280; margin: 0; font-size: 0.95rem; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem 4rem;
        }
        @media (max-width: 900px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 580px) { .gallery-grid { grid-template-columns: 1fr; } }

        .photo-item {
            border-radius: 8px;
            overflow: hidden;
            background: #e5e7eb;
            aspect-ratio: 4 / 3;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }
        .photo-item:hover img {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <header>
        <a href="/photos/" class="back-link">← Back to All Albums</a>
        <!-- Change Title & Date for Wings Over Solano (April 25, 2026) -->
        <h1>SF Fleet Week 2026</h1>
        <p class="date">October 10, 2026</p>
    </header>

    <main class="gallery-grid">
        <div class="photo-item">
            <a href="images/photo1.jpg" target="_blank"><img src="images/photo1.jpg" loading="lazy" alt="Photo 1"></a>
        </div>
        <div class="photo-item">
            <a href="images/photo2.jpg" target="_blank"><img src="images/photo2.jpg" loading="lazy" alt="Photo 2"></a>
        </div>
        <div class="photo-item">
            <a href="images/photo3.jpg" target="_blank"><img src="images/photo3.jpg" loading="lazy" alt="Photo 3"></a>
        </div>
    </main>

</body>
</html>
