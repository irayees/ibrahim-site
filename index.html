<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrahim Rayees</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .card {
            max-width: 540px;
            width: 100%;
        }
        .location {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 1rem 0;
        }
        p.bio {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #374151;
            margin: 0 0 2rem 0;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.35rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: var(--text);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #374151;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #f3f4f6;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="location">📍 Santa Clara, CA</div>
        <h1>Ibrahim Rayees</h1>
        <p class="bio">
            Welcome to my personal corner of the internet. Check out my photography archives from recent events, camps, and airshows, or connect with me on LinkedIn.
        </p>

        <div class="links">
            <a href="/photos/" class="btn btn-primary">📸 View Photo Albums</a>
            <!-- Replace the URL below with your exact LinkedIn link -->
            <a href="https://www.linkedin.com/in/ibrahimrayees/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                LinkedIn ↗
            </a>
        </div>
    </main>

</body>
</html>
