<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Ibrahim Rayees</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            text-align: center;
            padding: 3rem 1rem;
        }
        header h1 {
            margin: 0 0 0.5rem 0;
        }
        .back-link {
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        /* Responsive Grid System */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #fff;
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .photo-card:hover img {
            transform: scale(1.05); /* Slight zoom on hover */
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="back-link">← Back to Home</a>
        <h1>My Photos</h1>
        <p>A collection of my favorite shots.</p>
    </header>

    <main class="gallery-container">
        <!-- Photo 1 -->
        <div class="photo-card">
            <img src="images/photo1.jpg" alt="Description of first photo">
        </div>
        
        <!-- Photo 2 -->
        <div class="photo-card">
            <img src="images/photo2.jpg" alt="Description of second photo">
        </div>

        <!-- Photo 3 -->
        <div class="photo-card">
            <img src="images/photo3.jpg" alt="Description of third photo">
        </div>
    </main>

</body>
</html>
